<button id="chat-toggle" type="button" aria-label="Asistanı aç"
        class="fixed bottom-5 right-5 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-navy-900 text-white shadow-xl hover:bg-navy-700">
  <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
    <path d="M4 5h16v11H8l-4 4V5z"/><path d="M8 10h8M8 13h5"/>
  </svg>
</button>

<section id="chat-panel" hidden
         class="fixed inset-x-3 bottom-24 z-40 flex max-h-[70vh] flex-col overflow-hidden rounded-2xl bg-white shadow-2xl ring-1 ring-slate-200 sm:inset-x-auto sm:right-5 sm:w-96">
  <header class="flex items-center justify-between bg-navy-900 px-4 py-3 text-white">
    <div>
      <p class="font-semibold">VERA Katılım Asistan</p>
      <p class="text-xs text-slate-300">Yapay zekâ destekli · yanılabilir</p>
    </div>
    <button id="chat-close" type="button" class="rounded p-1 text-slate-300 hover:bg-white/10" aria-label="Kapat">✕</button>
  </header>
  <div id="chat-log" class="flex flex-1 flex-col gap-2 overflow-y-auto p-4">
    <div class="chat-msg chat-bot">Merhaba {{ user.full_name.split(' ')[0] }}, size nasıl yardımcı olabilirim?</div>
  </div>
  <form id="chat-form" class="flex gap-2 border-t border-slate-200 p-3">
    <input id="chat-input" class="input flex-1 py-2" placeholder="Mesajınızı yazın..." autocomplete="off" maxlength="2000">
    <button class="btn px-4 py-2">Gönder</button>
  </form>
</section>
