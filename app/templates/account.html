{% extends "base.html" %}
{% block title %}Hesap #{{ account.id }}{% endblock %}
{% block content %}
<a href="/" class="text-sm text-navy-600 hover:underline">← Ana sayfa</a>
<div class="card mt-4 p-6">
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <p class="text-sm text-slate-500">Hesap #{{ account.id }} · {{ account.full_name }}</p>
      <p class="mt-1 font-mono text-sm tracking-wider text-slate-700">{{ iban }}</p>
    </div>
    <div class="text-right">
      <p class="text-sm text-slate-500">Bakiye</p>
      <p class="text-3xl font-semibold text-navy-900">{{ account.balance | money }}</p>
    </div>
  </div>
</div>
<section class="card mt-6 p-6">
  <h2 class="font-serif text-lg text-navy-900">Hesap hareketleri</h2>
  <div class="mt-2">{% include "_tx_table.html" %}</div>
</section>
{% endblock %}
